<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Vipin Singh Site</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{const t=localStorage.adminTheme;if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="stylesheet" href="/tokens.css?v={{V}}">
<style>
/* Admin on the Signal tokens (public/tokens.css). Follows the system theme unless the
   toggle in the sidebar pins light or dark. The legacy names below are kept because the
   CRM screens use them inline. */
:root{--blue:var(--accent);--mute:var(--text-secondary);--line:var(--separator);--ink2:var(--text-primary);
  --surface:var(--bg-surface);--canvas:var(--bg-canvas);--field:color-mix(in srgb,var(--text-primary) 3.5%,var(--bg-surface));
  --hair:color-mix(in srgb,var(--text-primary) 9%,transparent);--hair2:color-mix(in srgb,var(--text-primary) 5%,transparent);
  --ok:var(--hue-load);--warn:var(--hue-source);--r:16px}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html{background:var(--bg-canvas)}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5;background:var(--bg-canvas);color:var(--text-primary);-webkit-font-smoothing:antialiased}
a{color:var(--accent-bright)}
h1,h2{font-weight:650;letter-spacing:-.022em;line-height:1.12}
button,input,select,textarea{font-family:inherit;font-size:14.5px;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--ink-900);color:var(--on-ink);padding:0 12px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid var(--separator-on-ink)}
.side .spec{display:flex;height:3px;margin:0 -12px 18px}.side .spec i{flex:1}
.spec i:nth-child(1){background:var(--hue-source-on-ink)}.spec i:nth-child(2){background:var(--hue-stage-on-ink)}.spec i:nth-child(3){background:var(--hue-profile-on-ink)}
.spec i:nth-child(4){background:var(--hue-map-on-ink)}.spec i:nth-child(5){background:var(--hue-verify-on-ink)}.spec i:nth-child(6){background:var(--hue-load-on-ink)}
.logo{display:flex;align-items:center;gap:11px;padding:4px 10px 22px}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;letter-spacing:.02em;
  background:conic-gradient(from 210deg,var(--hue-source-on-ink),var(--hue-profile-on-ink),var(--hue-stage-on-ink),var(--hue-map-on-ink),var(--hue-verify-on-ink),var(--hue-load-on-ink),var(--hue-source-on-ink));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.logo b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em}.logo small{display:block;font-size:11.5px;color:var(--on-ink-secondary)}
.side .grp-l{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6c6c80;padding:14px 12px 6px}
.side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--on-ink-secondary);text-decoration:none;cursor:pointer;margin-bottom:1px;font-weight:500;position:relative;transition:background .15s,color .15s}
.side a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.side a:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.on{background:color-mix(in srgb,var(--accent-on-ink) 18%,transparent);color:#fff}
.side a.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-on-ink)}
.side .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--hue-profile-on-ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.side .badge.soft{background:rgba(255,255,255,.12);color:var(--on-ink)}
.side .sp{flex:1;min-height:16px}
.side .foot{border-top:1px solid var(--separator-on-ink);padding-top:10px;margin-top:6px}
.theme{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;margin:4px 0 10px}
.theme button{flex:1;border:0;background:none;color:var(--on-ink-secondary);padding:6px 0;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500}
.theme button.on{background:rgba(255,255,255,.14);color:#fff}
.side .by{font-size:11px;color:#6c6c80;padding:8px 12px 0}
main{padding:34px clamp(16px,3.4vw,48px) 60px;max-width:1220px;width:100%}
main h1{font-size:30px;margin-bottom:4px}main .sub{color:var(--text-secondary);margin-bottom:24px}

/* ---- surfaces ---- */
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-card)}
.panel h2{font-size:18px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{--c:var(--accent);background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:18px 20px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-card)}
.stat:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.12;filter:blur(18px)}
.stat b{font-size:34px;font-weight:650;letter-spacing:-.03em;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--text-secondary);font-size:12.5px;font-weight:500}
.cards .stat:nth-child(4n+1){--c:var(--hue-map)}.cards .stat:nth-child(4n+2){--c:var(--hue-stage)}.cards .stat:nth-child(4n+3){--c:var(--hue-load)}.cards .stat:nth-child(4n+4){--c:var(--hue-source)}
.panel .cards .stat{box-shadow:none;background:var(--field)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--hair)}
td{padding:12px 10px;border-bottom:1px solid var(--hair2);vertical-align:top;transition:background .15s ease}
tr:hover td{background:var(--hair2)}tr:last-child td{border:0}
.tw{overflow-x:auto}.msgc{max-width:320px;color:var(--text-secondary)}.sm{font-size:12.5px;color:var(--text-secondary)}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--on-accent);padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;transition:background .15s,box-shadow .2s,transform .15s;white-space:nowrap}
.btn:hover{background:var(--accent-hover);box-shadow:var(--glow-accent)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn.alt{background:var(--surface);color:var(--text-primary);border-color:var(--hair)}.btn.alt:hover{border-color:var(--accent);color:var(--accent-bright);box-shadow:none}
.btn.del{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);padding:6px 12px;font-size:13px}
.btn.del:hover{background:var(--danger-surface);box-shadow:none}
.btn.sml{padding:6px 13px;font-size:13px}
.btn.alt.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-secondary)}.btn.ghost:hover{color:var(--text-primary);background:var(--hair2);box-shadow:none}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--field);color:var(--text-primary);transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--text-tertiary)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--text-primary) 18%,transparent)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);background:var(--surface);box-shadow:var(--shadow-focus)}
input[type=checkbox]{accent-color:var(--accent)}input[type=color]{background:var(--surface)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin:14px 0 6px}
select.st{width:auto;padding:5px 8px;font-size:13px}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}.bar input{max-width:300px}
.h3{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:12px}

/* ---- status pills, tinted from one hue each so both themes work ---- */
.pill{--c:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill.new{--c:var(--hue-map)}.pill.contacted,.pill.pending{--c:var(--hue-source)}.pill.qualified,.pill.confirmed,.pill.won,.pill.published{--c:var(--hue-load)}
.pill.lost{--c:var(--hue-profile)}.pill.completed{--c:var(--hue-verify)}.pill.cancelled,.pill.draft{--c:var(--text-tertiary)}.pill.featured{--c:var(--hue-stage)}

/* ---- dashboard ---- */
svg.spark{width:100%;height:120px;display:block}svg.spark rect{fill:var(--accent)}svg.spark rect:hover{fill:var(--hue-verify)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary);margin-top:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.brow{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.bk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbar{background:var(--hair2);border-radius:999px;height:7px;overflow:hidden}
.bbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--hue-verify));border-radius:999px}
.bv{font-variant-numeric:tabular-nums;color:var(--text-secondary);font-size:13px}
.banner{display:flex;gap:14px;align-items:flex-start;background:color-mix(in srgb,var(--hue-source) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--hue-source) 32%,transparent);padding:14px 18px;border-radius:14px;margin-bottom:18px}
.banner>div{flex:1}.banner .btn{flex:none}
.banner code,.panel code{background:var(--field);border:1px solid var(--hair);border-radius:6px;padding:1px 6px;font-family:var(--font-mono,ui-monospace),Consolas,monospace;font-size:12.5px}

/* ---- generic content editor ---- */
.grp{border:1px solid var(--hair);border-radius:14px;padding:6px 18px 18px;margin:12px 0;background:var(--hair2)}.grp>.gt{font-weight:650;margin-top:12px;font-size:13.5px}
.item{border:1px solid var(--hair);border-radius:12px;padding:4px 16px 14px;margin:10px 0;background:var(--surface);position:relative}
.item .rm{position:absolute;right:10px;top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--hair);background:var(--surface);padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13.5px}
.tabs button:hover{border-color:var(--accent)}.tabs button.on{background:var(--text-primary);color:var(--bg-canvas);border-color:var(--text-primary)}
.save{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg-canvas) 38%);padding:22px 0 8px;display:flex;gap:10px;align-items:center;z-index:2}
.imgup{display:flex;gap:14px;align-items:center}.imgup img{width:70px;height:88px;object-fit:cover;border-radius:10px;background:var(--hair2)}
.days{display:flex;gap:8px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:7px;margin:0;font-weight:500;color:var(--text-primary);padding:7px 12px;border:1px solid var(--hair);border-radius:99px;cursor:pointer}.days input{width:auto}
.days label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--ink-800);color:var(--on-ink);padding:12px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.3s;z-index:20;box-shadow:var(--shadow-panel);border:1px solid var(--separator-on-ink);pointer-events:none}
.toast.show{opacity:1;transform:none}

/* ---- sign in ---- */
.login{min-height:100vh;display:grid;place-items:center;background:var(--ink-900);position:relative;overflow:hidden;padding:20px}
.login:before,.login:after{content:"";position:absolute;width:620px;height:620px;border-radius:50%;filter:blur(110px);opacity:.5}
.login:before{background:var(--accent);left:-160px;top:-180px}.login:after{background:var(--hue-map-on-ink);right:-200px;bottom:-220px;opacity:.35}
.login form{position:relative;z-index:1;background:color-mix(in srgb,var(--ink-800) 82%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--on-ink);
  padding:36px;border-radius:24px;width:min(400px,100%);border:1px solid var(--separator-on-ink);box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.login .mark{margin-bottom:18px}.login h1{font-size:26px}.login .sm{color:var(--on-ink-secondary)}
.login label{color:var(--on-ink-secondary)}.login input{background:rgba(255,255,255,.06);border-color:var(--separator-on-ink);color:var(--on-ink)}
.login input:focus{background:rgba(255,255,255,.09);border-color:var(--accent-on-ink)}
.login .btn{width:100%;margin-top:20px;padding:12px}.err{color:#ff8a80;margin-top:10px;min-height:1em;font-size:13.5px}

/* ---- articles list ---- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}.ph .sub{margin:0}.phb{display:flex;gap:8px;flex-wrap:wrap}
.seg2{display:inline-flex;background:var(--hair2);border:1px solid var(--hair);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg2 button{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer}
.seg2 button.on{background:var(--surface);color:var(--text-primary);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg2 button i{font-style:normal;color:var(--text-tertiary);margin-left:5px;font-variant-numeric:tabular-nums}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.pc{background:var(--surface);border:1px solid var(--hair);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s,border-color .2s}
.pc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:var(--glow-hue)}
.pc .cv{text-decoration:none;aspect-ratio:16/10;background:var(--hair2) center/cover no-repeat;position:relative;cursor:pointer;display:block}
.pc .cv.none{display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 24%,var(--surface)),color-mix(in srgb,var(--hue-verify) 18%,var(--surface)))}
.pc .cv.none .ini{font-size:40px;font-weight:700;color:color-mix(in srgb,var(--text-primary) 40%,transparent)}
.pc .cv .pills{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.pc .cv .pill{background:color-mix(in srgb,var(--bg-surface) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pc .bd{padding:16px 18px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.pc h3{font-size:16px;font-weight:650;letter-spacing:-.012em;line-height:1.3;cursor:pointer}
.pc h3:hover{color:var(--accent-bright)}
.pc .meta{font-size:12.5px;color:var(--text-tertiary);display:flex;gap:8px;flex-wrap:wrap}
.pc .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--hair2);color:var(--text-secondary);margin:1px 3px 1px 0;white-space:nowrap}
.pc .act{display:flex;gap:6px;padding:12px 14px;border-top:1px solid var(--hair2);align-items:center}.pc .act .x{margin-left:auto}
.newcard{border:1.5px dashed var(--hair);background:transparent;box-shadow:none;display:grid;place-items:center;min-height:260px;cursor:pointer;color:var(--text-secondary);font-weight:600;gap:8px;text-align:center}
.newcard:hover{border-color:var(--accent);color:var(--accent-bright);transform:none;box-shadow:none}
.newcard b{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 8px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-bright);font-size:26px;font-weight:400}

/* ---- article editor ---- */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media(max-width:1100px){.ed{grid-template-columns:1fr}.ed .rail{position:static}}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13.5px}.crumbs a{color:var(--text-secondary);text-decoration:none}.crumbs a:hover{color:var(--accent-bright)}
.dirty{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-tertiary)}.dirty:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hue-load)}
.dirty.on{color:var(--hue-source)}.dirty.on:before{background:var(--hue-source)}
.ttl{font-size:30px;font-weight:650;letter-spacing:-.025em;line-height:1.2;border:0;background:none;padding:6px 0;box-shadow:none!important;resize:none;min-height:0;overflow:hidden}
.ttl:hover,.ttl:focus{background:none;border:0}
.sumf{border:0;background:none;padding:4px 0;font-size:16px;line-height:1.55;color:var(--text-secondary);box-shadow:none!important;resize:none;min-height:0;overflow:hidden}
.sumf:hover,.sumf:focus{background:none;border:0}
.writer{padding:0;overflow:hidden}
.tbar{display:flex;align-items:center;gap:2px;padding:8px 10px;border-bottom:1px solid var(--hair);flex-wrap:wrap;background:var(--hair2);position:sticky;top:0;z-index:1}
.tbar button{border:0;background:none;min-width:32px;height:32px;padding:0 8px;border-radius:8px;cursor:pointer;color:var(--text-secondary);font-weight:600;font-size:13.5px;display:inline-grid;place-items:center}
.tbar button:hover{background:var(--surface);color:var(--text-primary)}
.tbar button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbar .sep{width:1px;height:20px;background:var(--hair);margin:0 6px}
.tbar .seg2{margin-left:auto}
textarea.md{min-height:560px;border:0;border-radius:0;background:var(--surface);padding:22px 26px;box-shadow:none!important;
  font-family:var(--font-mono,ui-monospace),SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.75;tab-size:2}
.wfoot{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--hair2);font-size:12.5px;color:var(--text-tertiary);flex-wrap:wrap}
.wfoot label{margin:0;font-weight:500;color:var(--accent-bright);cursor:pointer}
.pvw{padding:28px 34px 34px;min-height:560px;font-size:17px;line-height:1.75;max-width:760px}
.pvw>*+*{margin-top:1em}.pvw h2{font-size:25px;margin-top:1.6em}.pvw h3{font-size:19px;margin-top:1.3em}
.pvw ul,.pvw ol{padding-left:1.3em}.pvw li+li{margin-top:.35em}
.pvw blockquote{border-left:3px solid var(--accent);padding:4px 0 4px 18px;font-size:20px;font-weight:500;color:var(--text-primary)}
.pvw img{max-width:100%;border-radius:12px;display:block}.pvw figure{margin-left:0;margin-right:0}
.pvw pre{background:var(--ink-900);color:var(--on-ink);padding:16px;border-radius:12px;overflow-x:auto;font-size:13px;line-height:1.6}
.pvw figcaption{font-size:12px;color:var(--text-tertiary);margin-bottom:6px}
.pvw code{font-size:.88em}.pvw hr{border:0;height:2px;background:linear-gradient(90deg,var(--hue-source),var(--hue-stage),var(--hue-profile),var(--hue-map),var(--hue-verify),var(--hue-load));border-radius:2px}
.pvw iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.rail{position:sticky;top:18px;display:flex;flex-direction:column;gap:14px}
.rail .panel{margin:0;padding:18px}.rail h2{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.rail label:first-of-type{margin-top:4px}
.pubrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-secondary);padding:6px 0;border-bottom:1px solid var(--hair2)}
.pubrow:last-of-type{border:0}.pubrow b{color:var(--text-primary);font-weight:600}
.pubbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.pubbtns .btn{width:100%}.pubbtns .full{grid-column:1/-1}

<script>
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
async function api(url,method='GET',body){const r=await fetch('/api/admin/'+url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&url!=='login'){login();throw 0}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
const svg=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
let me=null;
function login(msg){root.innerHTML=`<div class="login"><form id="lf"><div class="mark">VS</div><h1>Welcome back</h1>
<p class="sm" style="margin-top:4px">Sign in to manage your website, articles and customers.</p>
<label for="le">Email</label><input id="le" name="email" type="email" required autocomplete="username">
<label for="lpw">Password</label><input id="lpw" name="password" type="password" required autocomplete="current-password">
<div class="err" role="alert">${esc(msg||'')}</div><button class="btn">Sign in</button></form></div>`;
  $('#le').focus();
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;b.textContent='Signing in…';
    try{await api('login','POST',Object.fromEntries(new FormData(e.target)));boot()}catch(x){login(x&&x.message)}}}

// sidebar: [key,label,icon] rows, a bare [label] starts a group
const NAV=[['Overview'],['dash','Dashboard','M3 3h8v10H3zM13 3h8v6h-8zM13 11h8v10h-8zM3 15h8v6H3z'],
  ['Content'],['blog','Articles','M5 3h10l4 4v14H5zM15 3v4h4M8 12h8M8 16h6'],['content','Edit website','M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4'],
  ['People'],['customers','Customers','M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M22 20a6 6 0 0 0-5-5.9'],
  ['leads','Leads','M4 5h16v11H9l-5 4z'],['appts','Appointments','M4 6h16v14H4zM4 10h16M9 3v4M15 3v4'],
  ['System'],['settings','Settings','M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4']];
const setTheme=t=>{try{t?localStorage.adminTheme=t:localStorage.removeItem('adminTheme')}catch{}
  t?document.documentElement.dataset.theme=t:delete document.documentElement.dataset.theme;
  document.querySelectorAll('.theme button').forEach(b=>b.classList.toggle('on',b.dataset.th===t))};
async function boot(){try{me=await api('me')}catch{return}
  root.innerHTML=`<div class="app"><nav class="side" aria-label="Admin"><div class="spec" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="logo"><span class="mark">VS</span><div><b>Vipin Singh</b><small>Site manager</small></div></div>
  ${NAV.map(([k,l,d])=>l?`<a data-k="${k}" href="#${k}">${svg(d)}<span>${l}</span><span class="badge${k==='blog'?' soft':''}" hidden></span></a>`:`<div class="grp-l">${k}</div>`).join('')}
  <div class="sp"></div><div class="foot">
  <div class="theme" role="group" aria-label="Theme">${[['','Auto'],['light','Light'],['dark','Dark']].map(([t,l])=>`<button type="button" data-th="${t}">${l}</button>`).join('')}</div>
  <a href="/" target="_blank">${svg('M14 4h6v6M20 4l-9 9M18 14v6H4V6h6')}<span>View website</span></a>
  <a id="out" href="#">${svg('M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10')}<span>Sign out</span></a>
  <div class="by">Built by VSM Tech &amp; AI Solutions Agency</div></div></nav><main id="main"></main></div>`;
  document.querySelectorAll('.theme button').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));setTheme(document.documentElement.dataset.theme||'');
  $('#out').onclick=async e=>{e.preventDefault();await api('logout','POST');login()};route()}
async function badges(){try{const b=await api('badges');
  for(const [k,n] of [['leads',b.leads],['appts',b.appts],['blog',b.drafts]]){const el=document.querySelector(`.side a[data-k="${k}"] .badge`);
    if(el){el.textContent=n||'';el.hidden=!n;el.title=k==='blog'?n+' draft'+(n===1?'':'s'):n+' waiting'}}}catch{}}

// An editor with unsaved work sets leaveGuard; onSave is what Ctrl/Cmd+S runs on the current screen.
let leaveGuard=null,onSave=null,curHash=location.hash;
addEventListener('hashchange',()=>{if(!me)return;
  if(leaveGuard&&!leaveGuard()){history.replaceState(null,'',curHash||'#');return}
  leaveGuard=null;onSave=null;curHash=location.hash;route()});
addEventListener('beforeunload',e=>{if(leaveGuard&&!leaveGuard(true)){e.preventDefault();e.returnValue=''}});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&onSave){e.preventDefault();onSave()}});
function route(){const h=location.hash.slice(1)||'dash',k=h.split('/')[0];
  document.querySelectorAll('.side a[data-k]').forEach(a=>{a.classList.toggle('on',a.dataset.k===k);a.dataset.k===k?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  scrollTo(0,0);badges();
  ({dash,customers,leads,appts,blog,content,settings}[k]||dash)(h.split('/')[1])}
const banner=()=>me.must_change?'<div class="banner"><b>Change your default password.</b> Go to Settings → Password before sharing this site.</div>':'';
const fmt=d=>new Date(d.replace(' ','T')+'Z').toLocaleString([], {dateStyle:'medium',timeStyle:'short'});

const DAYS=()=>+(localStorage.statDays||30);
function spark(series){ // inline SVG bar chart — no chart library, no external script
  const w=760,h=120,n=series.length,max=Math.max(1,...series.map(d=>d.views)),bw=w/n;
  const bars=series.map((d,i)=>{const bh=Math.round(d.views/max*(h-18));
    return `<rect x="${(i*bw).toFixed(1)}" y="${h-bh}" width="${Math.max(1,bw-2).toFixed(1)}" height="${bh}" rx="2" fill="#0071e3"><title>${d.day}: ${d.views} views, ${d.visitors} visitors</title></rect>`}).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Daily page views">${bars}</svg>
    <div class="axis"><span>${series[0]?.day||''}</span><span>peak ${max}/day</span><span>${series[n-1]?.day||''}</span></div>`}
const barRows=(rows,total)=>rows.length?rows.map(r=>`<div class="brow"><span class="bk">${esc(r.k)}</span>
  <span class="bbar"><i style="width:${total?Math.round(r.c/total*100):0}%"></i></span>
  <span class="bv">${r.c}${r.v!==undefined?` <small>/ ${r.v}</small>`:''}</span></div>`).join(''):'<p class="sm">Nothing yet.</p>';

async function dash(){const s=await api('stats?days='+DAYS());const t=s.traffic;

function listPage(title,sub,route,statuses,cols,row,empty){return async()=>{
  const rows=await api(route);$('#main').innerHTML=`<h1>${title}</h1><p class="sub">${sub}</p>${banner()}<div class="bar"><input id="q" placeholder="Search"><a class="btn alt" href="/api/admin/${route}.csv" style="text-decoration:none">Export CSV</a></div>
  <div class="panel tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table><p class="sm" id="em" style="padding:10px"></p></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase(),f=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
    $('#tb').innerHTML=f.map(r=>`<tr>${row(r)}<td><select class="st" data-id="${r.id}">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn del" data-id="${r.id}">Delete</button></td></tr>`).join('');
    $('#em').textContent=f.length?'':empty};draw();$('#q').oninput=draw;
  $('#tb').onchange=async e=>{if(!e.target.classList.contains('st'))return;await api(route+'/'+e.target.dataset.id,'PATCH',{status:e.target.value});toast('Status updated')};
  $('#tb').onclick=async e=>{const b=e.target.closest('.del');if(!b||!confirm('Delete this record permanently?'))return;await api(route+'/'+b.dataset.id,'DELETE');rows.splice(rows.findIndex(r=>r.id==b.dataset.id),1);draw();toast('Deleted')}}}
const toCust=r=>r.customer_id?`<a class="sm" href="#customers/${r.customer_id}" style="color:var(--blue);text-decoration:none">Customer 360 →</a>`:'';
const leads=listPage('Leads','People who sent a message from the website.','leads',['new','contacted','qualified','won','lost'],['Received','Contact','Interest','Message'],
  l=>`<td class="sm">${fmt(l.created_at)}</td><td><b>${esc(l.name)}</b><div class="sm"><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.phone?'<br>'+esc(l.phone):''}${l.company?'<br>'+esc(l.company):''}</div>${toCust(l)}</td><td>${esc(l.service)}</td><td class="msgc">${esc(l.message)}</td>`,'No leads yet.');

// ---- uploads: big photos are shrunk in the browser first. Vercel rejects request
// bodies over 4.5 MB, and a 2000px JPEG is plenty for a cover or an inline image.
async function shrink(f,max=2000){
  if(f.size<1.2e6||!window.createImageBitmap)return f;
  try{const img=await createImageBitmap(f),k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));return b&&b.size<f.size?b:f}catch{return f}}
async function upload(f){f=await shrink(f);
  if(f.size>4.4e6)throw new Error('That image is over 4.4 MB even after resizing. Try a smaller one.');
  const r=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':f.type},body:f}),j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Upload failed ('+r.status+')');return j.url}
const cssUrl=u=>String(u||'').replace(/['"\\()\s]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'));

async function blog(id){
  if(id!==undefined&&id!=='') return postEditor(id==='new'?null:+id);
  const rows=await api('posts');let filter=localStorage.postFilter||'all',q='';
  const n={all:rows.length,published:rows.filter(p=>p.status==='published').length,draft:rows.filter(p=>p.status!=='published').length,featured:rows.filter(p=>p.featured).length};
  $('#main').innerHTML=`<div class="ph"><div><h1>Articles</h1><p class="sub">Write once, share on LinkedIn, get found on Google.</p></div>
    <div class="phb"><a class="btn alt" href="/blog" target="_blank">View blog &#8599;</a><a class="btn alt" href="/rss.xml" target="_blank">RSS</a><a class="btn" href="#blog/new">+ New article</a></div></div>${banner()}
  <div class="bar"><div class="seg2" id="pf" role="group" aria-label="Filter">${[['all','All'],['published','Published'],['draft','Drafts'],['featured','Featured']].map(([k,l])=>
    `<button type="button" data-f="${k}" class="${k===filter?'on':''}">${l}<i>${n[k]}</i></button>`).join('')}</div>
    <input id="q" placeholder="Search articles" aria-label="Search articles" style="margin-left:auto"></div>
  <div class="plist" id="pl"></div>`;
  const card=p=>{const pub=p.status==='published';return `<article class="pc">
    <a class="cv ${p.cover?'':'none'}" href="#blog/${p.id}" ${p.cover?`style="background-image:url('${cssUrl(p.cover)}')"`:''} aria-label="Edit ${esc(p.title)}">${p.cover?'':`<span class="ini">${esc(initials(p.title||'?'))}</span>`}
      <span class="pills"><span class="pill ${pub?'published':'draft'}">${pub?'Published':'Draft'}</span>${p.featured?'<span class="pill featured">Featured</span>':''}</span></a>
    <div class="bd"><h3><a href="#blog/${p.id}" style="color:inherit;text-decoration:none">${esc(p.title||'Untitled')}</a></h3>
      <div class="meta"><span>${p.published_at?fmt(p.published_at):'Not published yet'}</span>${p.updated_at?`<span>· edited ${ago(p.updated_at)}</span>`:''}</div>
      ${p.tags?`<div class="tags">${p.tags.split(',').map(t=>t.trim()).filter(Boolean).slice(0,3).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}</div>
    <div class="act"><a class="btn alt sml" href="#blog/${p.id}">Edit</a>
      <a class="btn ghost sml" href="${pub?'/blog/'+esc(p.slug):'/admin/preview/'+p.id}" target="_blank">${pub?'View':'Preview'} &#8599;</a>
      <button class="x" data-del="${p.id}" aria-label="Delete ${esc(p.title)}" title="Delete">&times;</button></div></article>`};
  const draw=()=>{
    const f=rows.filter(p=>(filter==='all'||(filter==='published'?p.status==='published':filter==='draft'?p.status!=='published':p.featured))
      &&(!q||JSON.stringify(p).toLowerCase().includes(q)));
    $('#pl').innerHTML=(q||filter==='published'||filter==='featured'?'':'<a class="pc newcard" href="#blog/new"><div><b>+</b>New article</div></a>')+f.map(card).join('')
      +(f.length||(!q&&filter!=='published'&&filter!=='featured')?'':`<div class="empty" style="grid-column:1/-1"><b>Nothing here</b>Try another filter or search.</div>`)};
  draw();
  $('#pf').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=localStorage.postFilter=b.dataset.f;
    $('#pf').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()};
  $('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
  $('#pl').onclick=guard(async e=>{const dl=e.target.closest('[data-del]');if(!dl)return;
    const p=rows.find(r=>r.id==dl.dataset.del);if(!confirm(`Delete “${p.title}” permanently?`))return;
    await api('posts/'+p.id,'DELETE');toast('Deleted');blog('')});
}

  $('#cvup').onchange=e=>{setCover(e.target.files[0]);e.target.value=''};
  $('#cv').addEventListener('input',drawCover);

  // toolbar: wraps the selection, or inserts a placeholder that is left selected
  const ins=(a,b='',ph='')=>{const s=bd.selectionStart,e=bd.selectionEnd,sel=bd.value.slice(s,e)||ph;bd.focus();
    bd.setRangeText(a+sel+b,s,e);bd.selectionStart=s+a.length;bd.selectionEnd=s+a.length+sel.length;bd.dispatchEvent(new Event('input',{bubbles:true}))};
  const block=(pre,ph)=>{const s=bd.selectionStart,e=bd.selectionEnd,ls=bd.value.lastIndexOf('\n',s-1)+1,cur=bd.value.slice(ls,e)||ph;
    const out=cur.split('\n').map((l,i)=>(typeof pre==='function'?pre(i):pre)+l.replace(/^(#{1,4}\s|>\s?|[-*]\s+|\d+[.)]\s+)/,'')).join('\n');

  $('#inup').onchange=guard(async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;toast('Uploading…');
    const u=await upload(f);ins(`\n\n![describe the image](${u})\n\n`);toast('Image added. Describe it inside the [ ] brackets.')});

  // live search & sharing preview, counters and checklist. The fallbacks mirror postPage() in server.js.
  const slugify=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
  const plain=s=>String(s||'').replace(/```[\s\S]*?```/g,' ').replace(/@\w+\([^)]*\)/g,' ').replace(/[#>*`_]|\[|\]|\(https?:[^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  const cut=(s,n)=>s.length>n?s.slice(0,n-1).trimEnd()+'…':s;
  const count=(el,n,lo,hi)=>{el.textContent=n+' / '+hi;el.className='cnt '+(n===0?'':n>=lo&&n<=hi?'ok':'warn')};
  const refresh=()=>{const v=val(),words=plain(v.body).split(' ').filter(Boolean).length;
    $('#wc').textContent=words+' words · '+Math.max(1,Math.round(words/200))+' min read';
    const title=v.seo_title||((v.title||'Untitled')+' — Vipin Singh'),desc=v.seo_description||v.summary||plain(v.body).slice(0,180);
    const slug=slugify(v.slug||v.title)||'post',host=location.host;
    $('#slp').textContent=host+'/blog/'+slug;
    count($('#stc'),v.seo_title.length,30,60);count($('#sdc'),v.seo_description.length,120,160);
    $('#pu').textContent=host+' › blog › '+slug;$('#pt').textContent=cut(title,60);$('#pd').textContent=cut(desc,160)||'Add a summary or meta description.';
    $('#pi').src=v.cover||'/img/vipin.jpg';$('#ot').textContent=v.title||'Untitled';$('#ou').textContent=host.toUpperCase();
    const kw=(v.keywords.split(',')[0]||'').trim().toLowerCase(),has=s=>kw&&String(s).toLowerCase().includes(kw);
    const checks=[
      [title.length>=30&&title.length<=60,'Search title is 30–60 characters ('+title.length+')'],
      [desc.length>=120&&desc.length<=160,'Description is 120–160 characters ('+desc.length+')'],
      [!!kw,'A focus keyword is set'],
      [has(title),'Focus keyword appears in the title'],
      [has(desc),'Focus keyword appears in the description'],
      [has(plain(v.body).slice(0,600)),'Focus keyword appears in the opening'],
      [!!v.cover,'Cover image is set'],
      [!v.cover||!!v.cover_alt.trim(),'Cover image has a description'],
      [words>=600,'At least 600 words ('+words+')'],
      [/^##\s/m.test(v.body),'Uses section headings (##), which build the contents list'],
    ];
    const ok=checks.filter(c=>c[0]).length;
    $('#ck').innerHTML=checks.map(([pass,t])=>`<li class="${pass?'ok':'warn'}">${esc(t)}</li>`).join('');
    $('#sc').textContent=ok+' / '+checks.length;
    const ring=$('#ring');ring.textContent=ok;ring.style.setProperty('--p',Math.round(ok/checks.length*100));
    ring.style.setProperty('--rc',ok>=8?'var(--hue-load)':ok>=5?'var(--hue-source)':'var(--hue-profile)');
    $('#sct').textContent=ok>=8?'Ready to share':ok>=5?'Nearly there':'Needs work';
  };

  // unsaved-changes tracking: the dot in the breadcrumb, the leave warning and Ctrl/Cmd+S
  let saved=JSON.stringify(val());
  const dirty=()=>JSON.stringify(val())!==saved;
  const mark=()=>{const d=dirty();dt.classList.toggle('on',d);dt.textContent=d?'Unsaved changes':id?'All changes saved':'Not saved yet'};
  const onEdit=()=>{refresh();mark()};
  $('.ed').addEventListener('input',onEdit);$('.ed').addEventListener('change',onEdit); // .ed is rebuilt per render, so listeners never pile up
  refresh();mark();
  leaveGuard=silent=>!dirty()||(!silent&&confirm('You have unsaved changes. Leave without saving?'));

  const save=async status=>{const btns=[...document.querySelectorAll('.pubbtns .btn')];btns.forEach(b=>b.disabled=true);
    try{const body={...val(),status},r=id?await api('posts/'+id,'PUT',body):await api('posts','POST',body);
      saved=JSON.stringify(val());leaveGuard=null;
      toast(status==='published'?(live?'Updated. The live article has your changes.':'Published and live'):live?'Unpublished. It is a draft again.':'Draft saved');
      if(!id)location.hash='blog/'+r.id;else postEditor(id)}
    catch(x){toast(x&&x.message||'Save failed');btns.forEach(b=>b.disabled=false)}};
  $('#pb').onclick=()=>save('published');
  $('#sv').onclick=()=>{if(live&&!confirm('Take this article off the website? It stays here as a draft.'))return;save('draft')};
  onSave=()=>save(live?'published':'draft');
  if(!id)$('#t').focus();
}

    $('#cem').innerHTML=d.customers.length?'':`<div class="empty"><b>${q||stage?'No customers match':'No customers yet'}</b>${q||stage?'Try another search or stage.':'They appear here automatically when someone sends an enquiry or books a call.'}</div>`;
    $('#ag').hidden=!d.agenda.length;$('#cg').classList.toggle('solo',!d.agenda.length);
    $('#agl').innerHTML=d.agenda.map(t=>`<a href="#customers/${t.customer_id}"><b>${esc(t.title)}</b><span>${esc(t.customer)}${t.due?' · ':''}</span>${dueTag(t)}</a>`).join('')});
  $('#pc').onclick=e=>{const b=e.target.closest('[data-st]');if(!b)return;stage=b.dataset.st;load()};
  $('#ctb').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r&&!e.target.closest('a'))location.hash='customers/'+r.dataset.id};
  $('#cq').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{q=e.target.value.trim();load()},200)};
  $('#cNew').onclick=()=>{$('#newBox').hidden=false;$('#nName').focus()};$('#nCancel').onclick=()=>{$('#newBox').hidden=true};
  $('#newBox').onsubmit=guard(async e=>{e.preventDefault();const r=await api('crm/customers','POST',Object.fromEntries(new FormData(e.target)));toast('Customer created');location.hash='customers/'+r.id});
  load()}

async function customer360(id){
  const d=await api('crm/customers/'+id),c=d.customer,m=d.meta,base='crm/customers/'+id;
  const reload=()=>customer360(id);
  const open=d.tasks.filter(t=>!t.done_at),idx=m.stages.findIndex(s=>s.key===c.stage);
  const kpis=[[shortDay(c.created_at.slice(0,10)),'First contact'],[ago(c.last_touch||c.created_at),'Last touch'],[d.leads.length+d.appointments.length,'Enquiries & bookings'],
    [open.length,'Open tasks'],...m.fields.filter(f=>f.type==='currency'&&c.fields[f.key]!==undefined).map(f=>[money(m,c.fields[f.key]),f.label])];
  const custom=new Set(m.activityTypes.map(t=>t.key)),present=[...new Set(d.activities.map(a=>a.type))];
  const label=t=>({lead:'Enquiries',appointment:'Bookings',stage:'Stage',task:'Tasks',system:'System'}[t]||m.activityTypes.find(x=>x.key===t)?.label||t);
  $('#main').innerHTML=`<a class="back" href="#customers">← All customers</a>
  <section class="hero360"><div class="hrow">${avatar(c.name,'big')}
    <div class="who"><h1>${esc(c.name)}</h1><p class="sub" style="margin:0">${esc([c.title,c.company].filter(Boolean).join(' · ')||'Add a job title and company in the profile')}</p>
      <div class="contact">${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:''}${c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:''}<span class="sm">Source: ${esc(c.source||'—')}${c.owner?' · Owner: '+esc(c.owner):''}</span></div></div>
    <button class="btn del" id="cDel">Delete customer</button></div>
    <div class="pipe" role="group" aria-label="Pipeline stage">${m.stages.map((s,i)=>`<button data-stage="${esc(s.key)}" class="${i<idx?'done':i===idx?'cur':''}" style="--c:${esc(s.color)}" aria-pressed="${i===idx}">${esc(s.label)}</button>`).join('')}</div>
    <div class="kpis">${kpis.map(([v,l])=>`<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div></section>
  <div class="c360"><div>
    <form class="panel" id="prof"><h2>Profile</h2><div class="fgrid">
      ${[['name','Full name'],['email','Email','email'],['phone','Phone','tel'],['company','Company'],['title','Job title'],['owner','Owner']].map(([k,l,t])=>
        `<div><label for="p_${k}">${l}</label><input id="p_${k}" name="${k}" type="${t||'text'}" value="${esc(c[k]||'')}"></div>`).join('')}
      ${m.fields.map(f=>`<div class="${f.type==='textarea'||f.type==='url'?'wide':''}"><label for="f_${esc(f.key)}">${esc(f.label)}</label>${fieldInput(f,c.fields[f.key])}</div>`).join('')}</div>
      <div class="inl"><button class="btn">Save profile</button></div></form>
    <div class="panel"><h2>Relationships<span class="cnt">${d.relationships.length||''}</span></h2>
      ${d.relationships.map(r=>`<div class="rel">${avatar(r.other_name,'sm')}<div><a href="#customers/${r.other_id}">${esc(r.other_name)}</a>
        <div class="sm">${r.dir==='out'?`${esc(c.name)} · <b>${esc(r.type)}</b> · ${esc(r.other_name)}`:`${esc(r.other_name)} · <b>${esc(r.type)}</b> · ${esc(c.name)}`}${r.note?' — '+esc(r.note):''}</div></div>
        <button class="x" data-rdel="${r.id}" aria-label="Remove relationship">×</button></div>`).join('')||'<p class="sm">Link this person to colleagues, referrers and decision makers.</p>'}
      ${d.others.length&&m.relTypes.length?`<form class="inl" id="relf"><select name="type" aria-label="Relationship type">${m.relTypes.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
        <select name="to_id" aria-label="Related customer">${d.others.map(o=>`<option value="${o.id}">${esc(o.name)}${o.company?' — '+esc(o.company):''}</option>`).join('')}</select>
        <button class="btn alt sml">Link</button></form>`:'<p class="sm" style="margin-top:8px">Add another customer to start building relationships.</p>'}</div>
    <div class="panel"><h2>Enquiries & bookings<span class="cnt">${d.leads.length+d.appointments.length||''}</span></h2>
      ${[...d.appointments.map(a=>({at:a.created_at,h:`<b>Call · ${esc(a.date)} at ${esc(a.time)}</b> <span class="pill ${esc(a.status)}">${esc(a.status)}</span><div class="sm">${esc([a.mode,a.topic].filter(Boolean).join(' · '))}</div>`,go:'appts'})),
         ...d.leads.map(l=>({at:l.created_at,h:`<b>Enquiry${l.service?' · '+esc(l.service):''}</b> <span class="pill ${esc(l.status)}">${esc(l.status)}</span><div class="sm">${esc(fmt(l.created_at))}</div>`,go:'leads'}))]
        .sort((a,b)=>a.at<b.at?1:-1).map(x=>`<div class="ixl">${x.h}</div>`).join('')||'<p class="sm">Nothing from the website yet.</p>'}</div>
  </div><div>
    <div class="panel"><h2>Tasks<span class="cnt">${open.length?open.length+' open':''}</span></h2>
      <form class="inl" id="taskf" style="margin:0 0 6px"><input name="title" placeholder="Add a task, e.g. Send migration proposal" aria-label="Task title" style="flex:3" required>
        <input name="due" type="date" aria-label="Due date" value="${dayISO(2)}"><select name="priority" aria-label="Priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select><button class="btn sml">Add</button></form>
      <div id="tl">${d.tasks.map(t=>`<div class="task ${t.done_at?'done':''}"><input type="checkbox" data-tdone="${t.id}" ${t.done_at?'checked':''} aria-label="Done: ${esc(t.title)}">
        <span class="pr ${esc(t.priority)}" title="${esc(t.priority)} priority"></span><div class="tt"><b>${esc(t.title)}</b>${dueTag(t)}</div>
        <button class="x" data-tdel="${t.id}" aria-label="Delete task">×</button></div>`).join('')||'<p class="sm">No tasks yet. Plan the next step above.</p>'}</div></div>
    <div class="panel"><h2>Timeline</h2>
      <form id="actf"><div class="seg2" role="radiogroup" aria-label="Activity type">${m.activityTypes.map((t,i)=>`<button type="button" role="radio" data-at="${esc(t.key)}" class="${i?'':'on'}" aria-checked="${!i}">${esc(t.label)}</button>`).join('')}</div>
        <textarea name="body" placeholder="What happened? Decisions, objections, next steps…" aria-label="Activity details" style="margin-top:10px" required></textarea>
        <div class="inl" style="justify-content:flex-end"><button class="btn sml">Log activity</button></div></form>
      ${present.length>1?`<div class="filt" id="filt"><button class="on" data-ft="">All</button>${present.map(t=>`<button data-ft="${esc(t)}">${esc(label(t))}</button>`).join('')}</div>`:''}
      <div class="tl" id="tlist">${d.activities.map(a=>`<div class="tli" data-type="${esc(a.type)}"><span class="tic" style="--c:${TCOL[a.type]||'#475569'}">${ico(a.type)}</span>
        <div class="tb"><div class="th"><b>${esc(a.title||label(a.type))}</b><span title="${esc(fmt(a.created_at))}">${ago(a.created_at)}${custom.has(a.type)?` <button class="x" data-adel="${a.id}" aria-label="Delete entry">×</button>`:''}</span></div>
        ${a.body?`<p>${esc(a.body)}</p>`:''}</div></div>`).join('')||'<p class="sm">No activity yet.</p>'}</div></div>
  </div></div>`;
  let atype=m.activityTypes[0]?.key;
  document.querySelector('.pipe').onclick=guard(async e=>{const b=e.target.closest('[data-stage]');if(!b||b.dataset.stage===c.stage)return;await api(base,'PATCH',{stage:b.dataset.stage});toast('Stage updated');reload()});
  $('#cDel').onclick=guard(async()=>{if(!confirm(`Delete ${c.name} with their tasks, notes and relationships? Their enquiries and bookings stay in Leads and Appointments.`))return;await api(base,'DELETE');toast('Customer deleted');location.hash='customers'});
  $('#prof').onsubmit=guard(async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target)),fields={};
    e.target.querySelectorAll('[data-f]').forEach(i=>{fields[i.dataset.f]=i.value});
    await api(base,'PATCH',{name:b.name,email:b.email,phone:b.phone,company:b.company,title:b.title,owner:b.owner,fields});toast('Profile saved');reload()});
  if($('#relf'))$('#relf').onsubmit=guard(async e=>{e.preventDefault();await api(base+'/relationships','POST',Object.fromEntries(new FormData(e.target)));toast('Relationship added');reload()});
  $('#taskf').onsubmit=guard(async e=>{e.preventDefault();await api(base+'/tasks','POST',Object.fromEntries(new FormData(e.target)));toast('Task added');reload()});
  $('#tl').onclick=guard(async e=>{const done=e.target.closest('[data-tdone]'),del=e.target.closest('[data-tdel]');
    if(done){await api('crm/tasks/'+done.dataset.tdone,'PATCH',{done:done.checked});toast(done.checked?'Task completed':'Task reopened');reload()}
    if(del&&confirm('Delete this task?')){await api('crm/tasks/'+del.dataset.tdel,'DELETE');reload()}});
  document.querySelector('.seg2').onclick=e=>{const b=e.target.closest('[data-at]');if(!b)return;atype=b.dataset.at;
    document.querySelectorAll('.seg2 button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-checked',x===b)})};
  $('#actf').onsubmit=guard(async e=>{e.preventDefault();await api(base+'/activities','POST',{type:atype,body:e.target.body.value});toast('Logged');reload()});
  if($('#filt'))$('#filt').onclick=e=>{const b=e.target.closest('[data-ft]');if(!b)return;$('#filt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('#tlist .tli').forEach(r=>r.hidden=!!b.dataset.ft&&r.dataset.type!==b.dataset.ft)};
  $('#tlist').onclick=guard(async e=>{const b=e.target.closest('[data-adel]');if(!b||!confirm('Delete this entry?'))return;await api('crm/activities/'+b.dataset.adel,'DELETE');reload()});
  document.querySelectorAll('.panel .rel [data-rdel]').forEach(b=>b.onclick=guard(async()=>{await api('crm/relationships/'+b.dataset.rdel,'DELETE');toast('Relationship removed');reload()}))}

// metadata editor: the CRM's structure is data, so the business can reshape it without a developer
async function crmSetup(){
  const m=await api('crm/meta');
  const mv='<button type="button" class="mv" data-mv="-1" aria-label="Move up">↑</button><button type="button" class="mv" data-mv="1" aria-label="Move down">↓</button><button type="button" class="x" data-rm aria-label="Remove">×</button>';
  const stageRow=s=>`<div class="mrow" data-key="${esc(s.key||'')}"><input type="color" value="${esc(s.color||'#0071e3')}" aria-label="Colour"><input class="grow" value="${esc(s.label||'')}" placeholder="Stage name" aria-label="Stage name">${mv}</div>`;
  const fieldRow=f=>`<div class="mrow" data-key="${esc(f.key||'')}"><input class="grow" value="${esc(f.label||'')}" placeholder="Field label" aria-label="Field label">
    <select aria-label="Field type">${['text','textarea','number','currency','date','url','select'].map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join('')}</select>
    <input class="grow opts" value="${esc((f.options||[]).join(', '))}" placeholder="Options, comma separated" aria-label="Options" ${f.type==='select'?'':'hidden'}>${mv}</div>`;
  $('#main').innerHTML=`<a class="back" href="#customers">← All customers</a><h1>CRM setup</h1><p class="sub">The pipeline, profile fields and activity types are configuration, not code. Change them here and every customer screen follows.</p>
  <div class="panel"><h2>Pipeline stages</h2><p class="sm">In order, left to right. Customers in a stage you remove move to the first stage.</p><div id="stg">${m.stages.map(stageRow).join('')}</div>
    <button class="btn alt sml" id="addS" style="margin-top:8px">Add stage</button></div>
  <div class="panel"><h2>Profile fields</h2><p class="sm">Shown on every customer profile. Currency fields also appear as headline figures.</p><div id="fld">${m.fields.map(fieldRow).join('')}</div>
    <button class="btn alt sml" id="addF" style="margin-top:8px">Add field</button></div>
  <div class="split" style="margin-top:0"><div class="panel"><h2>Relationship types</h2><p class="sm">One per line.</p><textarea id="rt" style="min-height:150px">${esc(m.relTypes.join('\n'))}</textarea></div>
    <div class="panel"><h2>Activity types</h2><p class="sm">One per line — what you can log on a timeline.</p><textarea id="atx" style="min-height:150px">${esc(m.activityTypes.map(t=>t.label).join('\n'))}</textarea>
      <label for="cur">Currency (ISO code)</label><input id="cur" value="${esc(m.currency||'USD')}" maxlength="3" style="max-width:120px;text-transform:uppercase"></div></div>
  <div class="save"><button class="btn" id="sv">Save setup</button><span class="sm">Changes apply immediately.</span></div>`;
  const rows=sel=>[...document.querySelectorAll(sel+' .mrow')];
  for(const id of ['#stg','#fld'])$(id).onclick=e=>{const r=e.target.closest('.mrow');if(!r)return;
    if(e.target.closest('[data-rm]'))r.remove();
    const mvb=e.target.closest('[data-mv]');if(mvb){const s=mvb.dataset.mv<0?r.previousElementSibling:r.nextElementSibling;if(s)mvb.dataset.mv<0?s.before(r):s.after(r)}};
  $('#fld').onchange=e=>{if(e.target.tagName==='SELECT')e.target.nextElementSibling.hidden=e.target.value!=='select'};
  $('#addS').onclick=()=>{$('#stg').insertAdjacentHTML('beforeend',stageRow({}));rows('#stg').pop().querySelector('.grow').focus()};
  $('#addF').onclick=()=>{$('#fld').insertAdjacentHTML('beforeend',fieldRow({type:'text'}));rows('#fld').pop().querySelector('.grow').focus()};
  $('#sv').onclick=guard(async()=>{
    const byLabel=Object.fromEntries(m.activityTypes.map(t=>[t.label.toLowerCase(),t.key]));
    await api('crm/meta','PUT',{
      stages:rows('#stg').map(r=>({key:r.dataset.key,color:r.querySelector('[type=color]').value,label:r.querySelector('.grow').value})),
      fields:rows('#fld').map(r=>({key:r.dataset.key,label:r.querySelector('.grow').value,type:r.querySelector('select').value,options:r.querySelector('.opts').value.split(',').map(s=>s.trim()).filter(Boolean)})),
      relTypes:$('#rt').value.split('\n'),
      activityTypes:$('#atx').value.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>({key:byLabel[l.toLowerCase()]||'',label:l})),
      currency:$('#cur').value.trim().toUpperCase()});
    toast('Setup saved');crmSetup()})}

boot();
</script></body></html>
