<!DOCTYPE html>

<style>

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.47;background:var(--bg);color:#1d1d1f;-webkit-font-smoothing:antialiased}

textarea{min-height:76px;resize:vertical}label{display:block;font-size:12px;font-weight:600;color:#445;margin:10px 0 4px;text-transform:none}
select.st{width:auto;padding:5px 8px;font-size:13px}

</style></head><body><div id="root"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
async function api(url,method='GET',body){const r=await fetch('/api/admin/'+url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&url!=='login'){login();throw 0}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
let me=null;
function login(msg){root.innerHTML=`<div class="login"><form id="lf"><h1>Admin sign in</h1><p class="sm">Vipin Singh website CMS</p>
<label>Email</label><input name="email" type="email" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password">
<div class="err">${esc(msg||'')}</div><button class="btn">Sign in</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('login','POST',Object.fromEntries(new FormData(e.target)));boot()}catch(x){login(x.message)}}}
async function boot(){try{me=await api('me')}catch{return}
  root.innerHTML=`<div class="app"><aside><div class="logo">Vipin Singh<small>Site manager</small></div>
  ${[['dash','Dashboard'],['customers','Customers'],['leads','Leads'],['appts','Appointments'],['blog','Articles'],['content','Edit website'],['settings','Settings']].map(([k,l])=>`<a data-k="${k}">${l}</a>`).join('')}
  <div class="sp"></div><a href="/" target="_blank">View website ↗</a><a id="out">Sign out</a><div class="by">Developed by VSM Tech & AI Solutions Agency</div></aside><main id="main"></main></div>`;
  document.querySelectorAll('aside a[data-k]').forEach(a=>a.onclick=()=>location.hash=a.dataset.k);
  $('#out').onclick=async()=>{await api('logout','POST');login()};route()}
addEventListener('hashchange',()=>me&&route());
function route(){const h=location.hash.slice(1)||'dash',k=h.split('/')[0];
  document.querySelectorAll('aside a[data-k]').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  ({dash,customers,leads,appts,blog,content,settings}[k]||dash)(h.split('/')[1])}
const banner=()=>me.must_change?'<div class="banner"><b>Change your default password.</b> Go to Settings → Password before sharing this site.</div>':'';
const fmt=d=>new Date(d.replace(' ','T')+'Z').toLocaleString([], {dateStyle:'medium',timeStyle:'short'});

const DAYS=()=>+(localStorage.statDays||30);
function spark(series){ // inline SVG bar chart — no chart library, no external script
  const w=760,h=120,n=series.length,max=Math.max(1,...series.map(d=>d.views)),bw=w/n;
  const bars=series.map((d,i)=>{const bh=Math.round(d.views/max*(h-18));
    return `<rect x="${(i*bw).toFixed(1)}" y="${h-bh}" width="${Math.max(1,bw-2).toFixed(1)}" height="${bh}" rx="2" fill="#0071e3"><title>${d.day}: ${d.views} views, ${d.visitors} visitors</title></rect>`}).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Daily page views">${bars}</svg>
    <div class="axis"><span>${series[0]?.day||''}</span><span>peak ${max}/day</span><span>${series[n-1]?.day||''}</span></div>`}
const barRows=(rows,total)=>rows.length?rows.map(r=>`<div class="brow"><span class="bk">${esc(r.k)}</span>
  <span class="bbar"><i style="width:${total?Math.round(r.c/total*100):0}%"></i></span>
  <span class="bv">${r.c}${r.v!==undefined?` <small>/ ${r.v}</small>`:''}</span></div>`).join(''):'<p class="sm">Nothing yet.</p>';

<div class="panel"><h2>Email</h2>

function listPage(title,sub,route,statuses,cols,row,empty){return async()=>{
  const rows=await api(route);$('#main').innerHTML=`<h1>${title}</h1><p class="sub">${sub}</p>${banner()}<div class="bar"><input id="q" placeholder="Search"><a class="btn alt" href="/api/admin/${route}.csv" style="text-decoration:none">Export CSV</a></div>
  <div class="panel tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table><p class="sm" id="em" style="padding:10px"></p></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase(),f=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
    $('#tb').innerHTML=f.map(r=>`<tr>${row(r)}<td><select class="st" data-id="${r.id}">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn del" data-id="${r.id}">Delete</button></td></tr>`).join('');
    $('#em').textContent=f.length?'':empty};draw();$('#q').oninput=draw;
  $('#tb').onchange=async e=>{if(!e.target.classList.contains('st'))return;await api(route+'/'+e.target.dataset.id,'PATCH',{status:e.target.value});toast('Status updated')};
  $('#tb').onclick=async e=>{const b=e.target.closest('.del');if(!b||!confirm('Delete this record permanently?'))return;await api(route+'/'+b.dataset.id,'DELETE');rows.splice(rows.findIndex(r=>r.id==b.dataset.id),1);draw();toast('Deleted')}}}
const toCust=r=>r.customer_id?`<a class="sm" href="#customers/${r.customer_id}" style="color:var(--blue);text-decoration:none">Customer 360 →</a>`:'';
const leads=listPage('Leads','People who sent a message from the website.','leads',['new','contacted','qualified','won','lost'],['Received','Contact','Interest','Message'],
  l=>`<td class="sm">${fmt(l.created_at)}</td><td><b>${esc(l.name)}</b><div class="sm"><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.phone?'<br>'+esc(l.phone):''}${l.company?'<br>'+esc(l.company):''}</div>${toCust(l)}</td><td>${esc(l.service)}</td><td class="msgc">${esc(l.message)}</td>`,'No leads yet.');
const appts=listPage('Appointments','Booking requests. Confirm or cancel; cancelled slots become available again.','appointments',['pending','confirmed','completed','cancelled'],['When','Contact','Topic','Notes'],
  a=>`<td><b>${esc(a.date)}</b><br>${esc(a.time)}<div class="sm">${esc(a.mode)}</div></td><td><b>${esc(a.name)}</b><div class="sm"><a href="mailto:${esc(a.email)}">${esc(a.email)}</a>${a.phone?'<br>'+esc(a.phone):''}</div>${toCust(a)}</td><td>${esc(a.topic)}</td><td class="msgc">${esc(a.message)}</td>`,'No appointments yet.');

async function blog(id){
  if(id!==undefined&&id!=='') return postEditor(id==='new'?null:+id);
  const rows=await api('posts');
  $('#main').innerHTML=`<h1>Articles</h1><p class="sub">Write once, share on LinkedIn, get found on Google.</p>${banner()}
  <div class="bar"><button class="btn" id="new">New article</button><input id="q" placeholder="Search">
  <a class="btn alt" href="/blog" target="_blank" style="text-decoration:none">View blog &#8599;</a>
  <a class="btn alt" href="/rss.xml" target="_blank" style="text-decoration:none">RSS</a></div>
  <div class="panel tw"><table><thead><tr><th>Article</th><th>Tags</th><th>Published</th><th>Status</th><th></th></tr></thead>
  <tbody id="tb"></tbody></table><p class="sm" id="em" style="padding:10px"></p></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase(),f=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
    $('#tb').innerHTML=f.map(p=>`<tr>
      <td><b>${esc(p.title)}</b><div class="sm">/blog/${esc(p.slug)}</div></td>
      <td class="sm">${esc(p.tags||'—')}</td>
      <td class="sm">${p.published_at?fmt(p.published_at):'—'}</td>
      <td><span class="pill ${p.status==='published'?'qualified':'pending'}">${esc(p.status)}</span>${p.featured?' <span class="pill new">featured</span>':''}</td>
      <td style="white-space:nowrap"><button class="btn alt sml" data-ed="${p.id}">Edit</button>
      <a class="btn alt sml" href="${p.status==='published'?'/blog/'+esc(p.slug):'/admin/preview/'+p.id}" target="_blank" style="text-decoration:none">View</a>
      <button class="btn del" data-del="${p.id}">Delete</button></td></tr>`).join('');
    $('#em').textContent=f.length?'':'No articles yet. Click “New article” to write the first one.'};
  draw();$('#q').oninput=draw;
  $('#new').onclick=()=>location.hash='blog/new';
  $('#tb').onclick=async e=>{const ed=e.target.closest('[data-ed]'),dl=e.target.closest('[data-del]');
    if(ed)location.hash='blog/'+ed.dataset.ed;
    if(dl&&confirm('Delete this article permanently?')){await api('posts/'+dl.dataset.del,'DELETE');toast('Deleted');blog('')}};
}

async function postEditor(id){
  const p=id?await api('posts/'+id):{id:0,title:'',slug:'',summary:'',body:'',cover:'',cover_alt:'',tags:'',status:'draft',
    seo_title:'',seo_description:'',keywords:'',canonical_url:'',featured:false};
  $('#main').innerHTML=`<h1>${id?'Edit article':'New article'}</h1>
  <p class="sub">${id?`<a href="/admin/preview/${p.id}" target="_blank">Preview &#8599;</a>`:'Saved as a draft until you publish it.'}</p>
  <div class="panel">
    <label>Title</label><input id="t" value="${esc(p.title)}" placeholder="What the reader sees on LinkedIn">
    <label>URL slug <span class="sm">(leave blank to build it from the title)</span></label>
    <input id="sl" value="${esc(p.slug)}" placeholder="sap-s4hana-data-migration-strategy">
    <label>Summary <span class="sm">(the preview text on LinkedIn and Google &mdash; aim for 140&ndash;180 characters)</span></label>
    <textarea id="su" style="min-height:62px">${esc(p.summary)}</textarea>
    <label>Tags <span class="sm">(comma separated)</span></label>
    <input id="tg" value="${esc(p.tags)}" placeholder="SAP S/4HANA, Syniti ADMM, Data Quality">
    <label><b>Cover image</b> <span class="sm">(shown in LinkedIn/Google previews)</span></label>
    <div class="imgup"><img id="cvimg" src="${esc(p.cover||'/img/vipin.jpg')}" alt="">
      <div><input id="cv" value="${esc(p.cover)}" placeholder="https://... or /uploads/cover.jpg" style="margin-bottom:6px">
      <input type="file" accept="image/jpeg,image/png,image/webp" id="cvup" style="padding:5px;display:block;width:100%"></div>
      <div class="sm" style="margin-top:6px;color:#86868b">Best size: 1600×1000px with the subject in the middle. The site crops it square on article cards and wide on LinkedIn and in the article, so keep the edges free of anything important.</div></div>
    <label>Image description <span class="sm">(alt text for accessibility)</span></label>
    <input id="ca" value="${esc(p.cover_alt)}" placeholder="Describe what's in the image (e.g., 'Migration architecture diagram')">
  </div>
  <div class="panel">
    <label>Body <span class="wc" id="wc"></span></label>
    <textarea id="bd" class="md" spellcheck="true">${esc(p.body)}</textarea>
    <details style="margin-top:12px"><summary class="sm" style="cursor:pointer">Formatting &amp; embeds cheat sheet</summary>
      <pre class="help">${esc(MD_HELP)}</pre></details>
    <div style="margin-top:12px"><input type="file" accept="image/jpeg,image/png,image/webp" id="inup" style="padding:5px">
      <span class="sm">Upload an image to drop into the body</span></div>
  </div>
  <div class="panel seo">
    <h2>Search &amp; sharing <span class="score" id="sc"></span></h2>
    <p class="sm">How this article appears on Google and when it is shared. Anything left blank falls back to the title and summary above.</p>
    <label>SEO title <span class="cnt" id="stc"></span></label>
    <input id="st" value="${esc(p.seo_title||'')}" placeholder="Defaults to: ${esc(p.title||'the article title')} — your name">
    <label>Meta description <span class="cnt" id="sdc"></span></label>
    <textarea id="sd" style="min-height:62px" placeholder="Defaults to the summary">${esc(p.seo_description||'')}</textarea>
    <label>Keywords <span class="sm">(comma separated: the searches this article should be found for. The first one is the focus keyword)</span></label>
    <input id="kw" value="${esc(p.keywords||'')}" placeholder="SAP data migration, S/4HANA cutover, data reconciliation">
    <label>Canonical URL <span class="sm">(only if this article was first published elsewhere, such as LinkedIn)</span></label>
    <input id="cu" value="${esc(p.canonical_url||'')}" placeholder="https://www.linkedin.com/pulse/...">
    <label class="chk"><input type="checkbox" id="ft" ${p.featured?'checked':''}> Feature this article: it leads the homepage and the articles page</label>
    <div class="previews">
      <div class="pv serp"><div class="k">Google</div><div class="u" id="pu"></div><div class="t" id="pt"></div><div class="d" id="pd"></div></div>
      <div class="pv og"><div class="k">LinkedIn &amp; social</div><img id="pi" alt=""><div class="b"><div class="t" id="ot"></div><div class="u" id="ou"></div></div></div>
    </div>
    <ul class="checks" id="ck"></ul>
  </div>
  <div class="save"><button class="btn" id="sv">Save draft</button>
    <button class="btn" id="pb">${p.status==='published'?'Save &amp; keep published':'Publish'}</button>
    ${p.status==='published'?'<button class="btn alt" id="un">Unpublish</button>':''}
    <button class="btn alt" id="bk">Back to list</button></div>`;

  const val=()=>({title:$('#t').value,slug:$('#sl').value,summary:$('#su').value,tags:$('#tg').value,
    cover:$('#cv').value,cover_alt:$('#ca').value,body:$('#bd').value,
    seo_title:$('#st').value,seo_description:$('#sd').value,keywords:$('#kw').value,canonical_url:$('#cu').value,featured:$('#ft').checked});

  // Live search & sharing preview, counters and checklist. The fallbacks mirror postPage() in server.js.
  const slugify=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
  const plain=s=>String(s||'').replace(/```[\s\S]*?```/g,' ').replace(/@\w+\([^)]*\)/g,' ').replace(/[#>*`_]|\[|\]|\(https?:[^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  const cut=(s,n)=>s.length>n?s.slice(0,n-1).trimEnd()+'…':s;
  const count=(el,n,lo,hi)=>{el.textContent=n+' / '+hi;el.className='cnt '+(n===0?'':n>=lo&&n<=hi?'ok':'warn')};
  const refresh=()=>{const v=val(),words=plain(v.body).split(' ').filter(Boolean).length;
    $('#wc').textContent=words+' words · '+Math.max(1,Math.round(words/200))+' min read';
    const title=v.seo_title||((v.title||'Untitled')+' — Vipin Singh'),desc=v.seo_description||v.summary||plain(v.body).slice(0,180);
    const slug=slugify(v.slug||v.title)||'post',host=location.host;
    count($('#stc'),v.seo_title.length,30,60);count($('#sdc'),v.seo_description.length,120,160);
    $('#pu').textContent=host+' › blog › '+slug;$('#pt').textContent=cut(title,60);$('#pd').textContent=cut(desc,160)||'Add a summary or meta description.';
    $('#pi').src=v.cover||'/img/vipin.jpg';$('#ot').textContent=v.title||'Untitled';$('#ou').textContent=host.toUpperCase();
    const kw=(v.keywords.split(',')[0]||'').trim().toLowerCase(),has=s=>kw&&String(s).toLowerCase().includes(kw);
    const checks=[
      [title.length>=30&&title.length<=60,'Search title is 30–60 characters ('+title.length+')'],
      [desc.length>=120&&desc.length<=160,'Description is 120–160 characters ('+desc.length+')'],
      [!!kw,'A focus keyword is set'],
      [has(title),'Focus keyword appears in the title'],
      [has(desc),'Focus keyword appears in the description'],
      [has(plain(v.body).slice(0,600)),'Focus keyword appears in the opening'],
      [!!v.cover,'Cover image is set'],
      [!v.cover||!!v.cover_alt.trim(),'Cover image has a description'],
      [words>=600,'At least 600 words ('+words+')'],
      [/^##\s/m.test(v.body),'Uses section headings (##), which build the contents list'],
    ];
    const ok=checks.filter(c=>c[0]).length;
    $('#ck').innerHTML=checks.map(([pass,t])=>`<li class="${pass?'ok':'warn'}">${esc(t)}</li>`).join('');
    $('#sc').textContent=ok+' / '+checks.length;
  };
  ['#t','#sl','#su','#tg','#cv','#ca','#bd','#st','#sd','#kw','#cu'].forEach(s=>$(s).addEventListener('input',refresh));
  refresh();
  $('#cv').oninput=()=>{$('#cvimg').src=$('#cv').value||'/img/vipin.jpg';refresh()};
  const upload=async(f)=>{const r=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':f.type},body:f});
    const j=await r.json();if(!r.ok)throw new Error(j.error);return j.url};
  $('#cvup').onchange=async e=>{if(!e.target.files[0])return;
    try{const u=await upload(e.target.files[0]);$('#cv').value=u;$('#cvimg').src=u;refresh();toast('Uploaded. Save to keep it.')}catch(x){toast(x.message)}};
  $('#inup').onchange=async e=>{if(!e.target.files[0])return;
    try{const u=await upload(e.target.files[0]);const t=$('#bd');
      const snip=`\n![describe the image](${u})\n`;
      t.value=t.value.slice(0,t.selectionStart)+snip+t.value.slice(t.selectionStart);
      toast('Image added to the body')}catch(x){toast(x.message)}};

  const save=async status=>{try{
      const body={...val(),status};
      const r=id?await api('posts/'+id,'PUT',body):await api('posts','POST',body);
      toast(status==='published'?'Published and live':'Draft saved');
      if(!id)location.hash='blog/'+r.id; else postEditor(id);
    }catch(x){toast(x.message)}};
  $('#sv').onclick=()=>save('draft');
  $('#pb').onclick=()=>save('published');
  if($('#un'))$('#un').onclick=()=>save('draft');
  $('#bk').onclick=()=>location.hash='blog';
}

// ---- generic content editor ----
const nice=k=>k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).replace(/_/g,' ');
const isImg=(p)=>/photo|image/i.test(p);
function field(v,path,label){
  if(Array.isArray(v)){if(v.every(x=>typeof x==='string'))return`<label>${label} <span class="sm">(one per line)</span></label><textarea data-p="${path}" data-t="lines">${esc(v.join('\n'))}</textarea>`;
    return`<div class="grp"><div class="gt">${label}</div>${v.map((it,i)=>`<div class="item"><button class="btn del rm" data-rm="${path}.${i}" type="button">Remove</button>${Object.entries(it).map(([k,x])=>field(x,`${path}.${i}.${k}`,nice(k))).join('')}</div>`).join('')}<button class="btn alt" type="button" data-add="${path}">+ Add item</button></div>`}
  if(v&&typeof v==='object')return`<div class="grp"><div class="gt">${label}</div>${Object.entries(v).map(([k,x])=>field(x,`${path}.${k}`,nice(k))).join('')}</div>`;
  if(isImg(path))return`<label>${label}</label><div class="imgup"><img src="${esc(v)}" alt=""><div><input data-p="${path}" value="${esc(v)}"><input type="file" accept="image/jpeg,image/png,image/webp" data-up="${path}" style="margin-top:6px;padding:5px"></div></div>`;
  return String(v).length>70?`<label>${label}</label><textarea data-p="${path}">${esc(v)}</textarea>`:`<label>${label}</label><input data-p="${path}" value="${esc(v)}">`}
function setPath(o,p,v){const k=p.split('.');let a=o;while(k.length>1)a=a[k.shift()];a[k[0]]=v}
function getPath(o,p){return p.split('.').reduce((a,k)=>a[k],o)}
const LABELS={brand:'Brand & contact',seo:'SEO',hero:'Hero (video chapters)',story:'Story',services:'Services',platforms:'Platforms',impact:'Results',engagements:'Engagements',process:'Process',about:'About',booking:'Booking',contact:'Contact',footer:'Footer'};
async function content(){const D=await (await fetch('/api/content')).json();let tab=localStorage.cmsTab||'brand';
  const render=()=>{$('#main').innerHTML=`<h1>Edit website</h1><p class="sub">Change any text, list or image. Save to publish instantly.</p>${banner()}
  <div class="tabs">${Object.keys(LABELS).map(k=>`<button data-t="${k}" class="${k===tab?'on':''}">${LABELS[k]}</button>`).join('')}</div>
  <div class="panel" id="ed">${field(D[tab],tab,LABELS[tab])}</div>
  <div class="save"><button class="btn" id="sv">Save changes</button><button class="btn alt" id="rs">Restore defaults</button><a href="/" target="_blank" class="sm">Preview site ↗</a></div>`;
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=localStorage.cmsTab=b.dataset.t;render()});
    const ed=$('#ed');
    ed.oninput=e=>{const p=e.target.dataset.p;if(!p)return;setPath(D,p,e.target.dataset.t==='lines'?e.target.value.split('\n').map(s=>s.trim()).filter(Boolean):e.target.value)};
    ed.onclick=e=>{const rm=e.target.closest('[data-rm]'),ad=e.target.closest('[data-add]');
      if(rm){const k=rm.dataset.rm.split('.'),i=+k.pop();getPath(D,k.join('.')).splice(i,1);render()}
      if(ad){const arr=getPath(D,ad.dataset.add),t=JSON.parse(JSON.stringify(arr[0]||{title:'',text:''}));Object.keys(t).forEach(k=>t[k]='');arr.push(t);render()}};
    ed.onchange=async e=>{const p=e.target.dataset.up;if(!p||!e.target.files[0])return;const f=e.target.files[0];
      try{const r=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':f.type},body:f}),j=await r.json();if(!r.ok)throw new Error(j.error);setPath(D,p,j.url);render();toast('Image uploaded. Save to publish.')}catch(x){toast(x.message)}};
    $('#sv').onclick=async()=>{await api('content','PUT',D);toast('Saved and live')};

// ---- customers (CRM). Stages, profile fields, relationship and activity types all come from crm/meta ----
const ICONS={note:'M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4',call:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',
  email:'M3 6h18v12H3zM3 7l9 6 9-6',meeting:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M22 20a6 6 0 0 0-5-5.9',
  lead:'M4 5h16v11H9l-5 4z',appointment:'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',stage:'M5 21V4h11l-2 4 2 4H5',task:'M4 12.5l5 5L20 6.5',system:'M12 8v4l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'};
const TCOL={lead:'#0071e3',appointment:'#7c3aed',stage:'#b45309',task:'#15803d',system:'#6e6e73',note:'#1d1d1f',call:'#0e7490',email:'#2563eb',meeting:'#db2777'};
const ico=k=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[k]||ICONS.note}"/></svg>`;
const hue=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avatar=(n,cls='')=>`<span class="av ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;
const toDate=d=>new Date(String(d).length>10?String(d).replace(' ','T')+'Z':d+'T00:00:00');
const ago=d=>{if(!d)return'—';const m=Math.round((Date.now()-toDate(d))/6e4);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';
  const dd=Math.round(h/24);if(dd<30)return dd+'d ago';const mo=Math.round(dd/30);return mo<12?mo+'mo ago':Math.round(mo/12)+'y ago'};
const dayISO=(o=0)=>{const d=new Date(Date.now()+o*864e5);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const shortDay=d=>toDate(d).toLocaleDateString([], {day:'numeric',month:'short',year:d.slice(0,4)===dayISO().slice(0,4)?undefined:'numeric'});
const dueTag=t=>{if(!t.due)return'';const td=dayISO(),late=!t.done_at&&t.due<td,today=!t.done_at&&t.due===td;
  return `<span class="due ${late?'late':today?'today':''}">${late?'Overdue · ':''}${today?'Due today':shortDay(t.due)}</span>`};
const stageOf=(m,k)=>m.stages.find(s=>s.key===k)||{key:k,label:k||'—',color:'#6e6e73'};
const stagePill=(m,k)=>{const s=stageOf(m,k);return `<span class="spill" style="--c:${esc(s.color)}">${esc(s.label)}</span>`};
const money=(m,v)=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:m.currency||'USD',maximumFractionDigits:0}).format(v)}catch{return String(v)}};
const fieldText=(m,f,v)=>v===undefined||v===''?'':f.type==='currency'?money(m,v):f.type==='date'?shortDay(v):String(v);
function fieldInput(f,v){const a=`id="f_${esc(f.key)}" data-f="${esc(f.key)}"`,val=v??'';
  if(f.type==='select')return `<select ${a}><option value="">—</option>${f.options.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(f.type==='textarea')return `<textarea ${a}>${esc(val)}</textarea>`;
  return `<input ${a} type="${{number:'number',currency:'number',date:'date',url:'url'}[f.type]||'text'}" ${f.type==='currency'?'min="0" step="any"':''} value="${esc(val)}">`}
const guard=f=>async(...x)=>{try{await f(...x)}catch(e){if(e)toast(e.message)}};

  const stageRow=s=>`<div class="mrow" data-key="${esc(s.key||'')}"><input type="color" value="${esc(s.color||'#0071e3')}" aria-label="Colour"><input class="grow" value="${esc(s.label||'')}" placeholder="Stage name" aria-label="Stage name">${mv}</div>`;
  const fieldRow=f=>`<div class="mrow" data-key="${esc(f.key||'')}"><input class="grow" value="${esc(f.label||'')}" placeholder="Field label" aria-label="Field label">
    <select aria-label="Field type">${['text','textarea','number','currency','date','url','select'].map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join('')}</select>
    <input class="grow opts" value="${esc((f.options||[]).join(', '))}" placeholder="Options, comma separated" aria-label="Options" ${f.type==='select'?'':'hidden'}>${mv}</div>`;
  $('#main').innerHTML=`<a class="back" href="#customers">← All customers</a><h1>CRM setup</h1><p class="sub">The pipeline, profile fields and activity types are configuration, not code. Change them here and every customer screen follows.</p>
  <div class="panel"><h2>Pipeline stages</h2><p class="sm">In order, left to right. Customers in a stage you remove move to the first stage.</p><div id="stg">${m.stages.map(stageRow).join('')}</div>
    <button class="btn alt sml" id="addS" style="margin-top:8px">Add stage</button></div>
  <div class="panel"><h2>Profile fields</h2><p class="sm">Shown on every customer profile. Currency fields also appear as headline figures.</p><div id="fld">${m.fields.map(fieldRow).join('')}</div>
    <button class="btn alt sml" id="addF" style="margin-top:8px">Add field</button></div>
  <div class="split" style="margin-top:0"><div class="panel"><h2>Relationship types</h2><p class="sm">One per line.</p><textarea id="rt" style="min-height:150px">${esc(m.relTypes.join('\n'))}</textarea></div>
    <div class="panel"><h2>Activity types</h2><p class="sm">One per line — what you can log on a timeline.</p><textarea id="atx" style="min-height:150px">${esc(m.activityTypes.map(t=>t.label).join('\n'))}</textarea>
      <label for="cur">Currency (ISO code)</label><input id="cur" value="${esc(m.currency||'USD')}" maxlength="3" style="max-width:120px;text-transform:uppercase"></div></div>
  <div class="save"><button class="btn" id="sv">Save setup</button><span class="sm">Changes apply immediately.</span></div>`;
  const rows=sel=>[...document.querySelectorAll(sel+' .mrow')];
  for(const id of ['#stg','#fld'])$(id).onclick=e=>{const r=e.target.closest('.mrow');if(!r)return;
    if(e.target.closest('[data-rm]'))r.remove();
    const mvb=e.target.closest('[data-mv]');if(mvb){const s=mvb.dataset.mv<0?r.previousElementSibling:r.nextElementSibling;if(s)mvb.dataset.mv<0?s.before(r):s.after(r)}};
  $('#fld').onchange=e=>{if(e.target.tagName==='SELECT')e.target.nextElementSibling.hidden=e.target.value!=='select'};
  $('#addS').onclick=()=>{$('#stg').insertAdjacentHTML('beforeend',stageRow({}));rows('#stg').pop().querySelector('.grow').focus()};
  $('#addF').onclick=()=>{$('#fld').insertAdjacentHTML('beforeend',fieldRow({type:'text'}));rows('#fld').pop().querySelector('.grow').focus()};
  $('#sv').onclick=guard(async()=>{
    const byLabel=Object.fromEntries(m.activityTypes.map(t=>[t.label.toLowerCase(),t.key]));
    await api('crm/meta','PUT',{
      stages:rows('#stg').map(r=>({key:r.dataset.key,color:r.querySelector('[type=color]').value,label:r.querySelector('.grow').value})),
      fields:rows('#fld').map(r=>({key:r.dataset.key,label:r.querySelector('.grow').value,type:r.querySelector('select').value,options:r.querySelector('.opts').value.split(',').map(s=>s.trim()).filter(Boolean)})),
      relTypes:$('#rt').value.split('\n'),
      activityTypes:$('#atx').value.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>({key:byLabel[l.toLowerCase()]||'',label:l})),
      currency:$('#cur').value.trim().toUpperCase()});
    toast('Setup saved');crmSetup()})}

boot();
</script></body></html>
